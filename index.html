<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.github.com; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FAF9F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Knowledge Base</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23B9532F'/%3E%3Cpath d='M9 7h9l5 5v13H9z' fill='%23FAF9F5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#FAF9F5;--panel:#F0EEE6;--panel-2:#E6E3D8;--card:#FFFFFF;
  --ink:#2B2A26;--ink-2:#55544D;--ink-3:#6B6A62;--line:#DEDACD;
  --accent:#B9532F;--accent-ink:#FFFFFF;--accent-soft:#F4E4DB;--danger:#A32D1B;
  --c0:#B9532F;--c1:#8A6A12;--c2:#4F7A32;--c3:#1F7A72;--c4:#39689E;--c5:#7E4E8C;
  --shadow:0 8px 30px rgba(60,50,30,.16);
  --sans:"IBM Plex Sans Thai","IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",Roboto,sans-serif;
  --serif:"Source Serif 4","Noto Serif Thai",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tap:36px;--side:296px;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#262624;--panel:#1F1E1D;--panel-2:#30302E;--card:#30302E;
  --ink:#FAF9F5;--ink-2:#C9C7BD;--ink-3:#A3A198;--line:#403F3B;
  --accent:#D97757;--accent-ink:#1F1E1D;--accent-soft:#45322A;--danger:#F08A73;
  --c0:#E08A6B;--c1:#D0AE55;--c2:#93BC6E;--c3:#5DBDB2;--c4:#83AEDD;--c5:#BE93CC;
  --shadow:0 8px 30px rgba(0,0,0,.45);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    color-scheme:dark;
    --bg:#262624;--panel:#1F1E1D;--panel-2:#30302E;--card:#30302E;
    --ink:#FAF9F5;--ink-2:#C9C7BD;--ink-3:#A3A198;--line:#403F3B;
    --accent:#D97757;--accent-ink:#1F1E1D;--accent-soft:#45322A;--danger:#F08A73;
    --c0:#E08A6B;--c1:#D0AE55;--c2:#93BC6E;--c3:#5DBDB2;--c4:#83AEDD;--c5:#BE93CC;
    --shadow:0 8px 30px rgba(0,0,0,.45);
  }
}
@media (pointer:coarse){:root{--tap:44px}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
a{color:var(--accent)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
[hidden]{display:none!important}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:var(--tap);padding:0 13px;border-radius:9px;font-weight:500;white-space:nowrap;border:1px solid var(--line);background:var(--card)}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--panel-2)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:var(--tap);height:var(--tap);border-radius:8px;color:var(--ink-2);flex:none}
.icon-btn:hover:not(:disabled){background:var(--panel-2);color:var(--ink)}
.icon-btn[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}

/* Connect screen */
.gate{height:100%;overflow:auto;display:flex;justify-content:center;padding:max(32px,env(safe-area-inset-top)) 18px 32px}
.gate-inner{width:100%;max-width:470px;margin:auto 0}
.gate h1{font:600 34px/1.2 var(--serif);margin:0 0 8px;letter-spacing:-.01em}
.gate>div>p{color:var(--ink-2);margin:0 0 24px}
.field{display:block;margin-bottom:16px}
.field>span{display:block;font-weight:500;margin-bottom:5px}
.field small{display:block;color:var(--ink-3);margin-top:5px;line-height:1.4}
.field input,.field select{width:100%;min-height:44px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:16px}
.field input:focus,.field select:focus{border-color:var(--accent);outline:2px solid var(--accent-soft);outline-offset:0}
.check{display:flex;gap:9px;align-items:center;margin-bottom:18px;min-height:32px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.err{color:var(--danger);font-size:14px;margin:0 0 14px}
.gate .btn.primary{width:100%;min-height:46px}
.help{margin-top:24px;border-top:1px solid var(--line);padding-top:14px}
.help summary{cursor:pointer;font-weight:500;min-height:32px;display:flex;align-items:center}
.help ol{padding-left:22px;margin:10px 0 0;color:var(--ink-2)}
.help li{margin-bottom:9px}
.safe-note{font-size:13.5px;color:var(--ink-3);margin-top:14px}

/* Shell */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100%;height:100dvh}
.shell.side-off{grid-template-columns:0 minmax(0,1fr)}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;padding-left:env(safe-area-inset-left)}
.side-head{display:flex;align-items:center;gap:6px;padding:max(12px,env(safe-area-inset-top)) 10px 10px 16px}
.side-head h1{font:600 20px/1.25 var(--serif);margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.005em}
.side-tools{display:flex;gap:8px;padding:0 12px 10px}
.side-tools .btn{flex:none}
.filter{position:relative;flex:1;min-width:0}
.filter .ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.filter input{width:100%;height:var(--tap);padding:0 8px 0 33px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:16px}
@media (pointer:fine){.filter input{font-size:14px}}
.filter input:focus{border-color:var(--accent);outline:none}
.tree{flex:1;overflow:auto;padding:2px 6px 12px;min-height:0;-webkit-overflow-scrolling:touch}
.tree ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;border-radius:7px;position:relative;min-height:var(--tap)}
.row:hover{background:var(--panel-2)}
.row.active{background:var(--accent-soft)}
.row.active .row-name{color:var(--accent);font-weight:500}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:6px;min-height:var(--tap);padding:3px 2px 3px calc(6px + var(--depth,0) * 15px);text-align:left;border-radius:7px}
.row-main .ic{color:var(--ink-3)}
.row-main .ic.chev{width:14px;height:14px;transition:transform .12s}
.row[aria-expanded=true] .ic.chev{transform:rotate(90deg)}
.chev-space{width:14px;flex:none}
.row-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.row-more{opacity:0}
.row:hover .row-more,.row:focus-within .row-more{opacity:1}
@media (hover:none){.row-more{opacity:.7}}
.tree-empty{padding:14px 12px;color:var(--ink-3);font-size:14px}
.side-foot{border-top:1px solid var(--line);padding:8px 8px max(8px,env(safe-area-inset-bottom)) 14px;display:flex;align-items:center;gap:2px}
.repo-tag{flex:1;min-width:0;font-size:13px;color:var(--ink-2);line-height:1.3}
.repo-tag b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.repo-tag span{display:flex;align-items:center;gap:4px}
.repo-tag .ic{width:12px;height:12px}
.repo-tag .warn{color:var(--danger)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;padding-right:env(safe-area-inset-right)}
.top{display:flex;align-items:center;gap:6px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);min-height:54px}
.crumbs{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;overflow:hidden;white-space:nowrap}
.crumb-path{color:var(--ink-3);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.crumb-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;flex:0 10 auto;min-width:40px}
.state{font-size:13px;color:var(--ink-3);white-space:nowrap;margin-right:4px}
.state.dirty{color:var(--accent)}
.state.bad{color:var(--danger)}
.banner{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--accent-soft);font-size:14px}
.banner span{flex:1;min-width:0}
.body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.scrim{display:none}

/* Home */
.home{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.home-inner{width:100%;max-width:560px}
.home h2{font:600 32px/1.2 var(--serif);margin:0 0 8px;letter-spacing:-.01em}
.home p{color:var(--ink-2);margin:0 0 24px}
.starts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.start{display:flex;flex-direction:column;gap:6px;padding:15px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:left;min-height:104px}
.start:hover{border-color:var(--accent)}
.start .ic{color:var(--accent);width:22px;height:22px}
.start b{font-weight:600}
.start small{color:var(--ink-3);line-height:1.35}
.home .btn{margin-top:16px}
.load{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-3);padding:20px;text-align:center}

/* Text notes */
.note{flex:1;min-height:0;display:flex;flex-direction:column}
.note-bar{display:flex;align-items:center;gap:2px;padding:6px 12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.note-bar::-webkit-scrollbar{display:none}
.seg{display:inline-flex;background:var(--panel);border-radius:9px;padding:2px;margin-right:8px;flex:none}
.seg button{min-height:calc(var(--tap) - 4px);padding:0 13px;border-radius:7px;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.fmt{min-width:var(--tap);height:var(--tap);border-radius:7px;color:var(--ink-2);font-weight:600;flex:none;padding:0 7px}
.fmt:hover{background:var(--panel-2);color:var(--ink)}
.fmt.i{font-style:italic;font-family:var(--serif)}
.note-scroll{flex:1;overflow:auto;min-height:0;display:flex;-webkit-overflow-scrolling:touch}
.note textarea{flex:1;display:block;width:100%;max-width:760px;margin:0 auto;border:0;background:none;resize:none;padding:26px 24px 80px;font:400 17px/1.75 var(--serif);min-height:100%}
.note textarea:focus{outline:none}
.prose{width:100%;max-width:760px;margin:0 auto;padding:26px 24px 80px;font:400 17px/1.75 var(--serif);overflow-wrap:break-word}
.prose h1,.prose h2,.prose h3,.prose h4{font-family:var(--serif);font-weight:600;line-height:1.3;margin:1.5em 0 .5em}
.prose h1{font-size:30px;margin-top:0}.prose h2{font-size:24px}.prose h3{font-size:20px}.prose h4{font-size:17px}
.prose p,.prose ul,.prose ol,.prose blockquote,.prose pre,.prose table{margin:0 0 1em}
.prose ul,.prose ol{padding-left:1.5em}
.prose li{margin-bottom:.25em}
.prose li>ul,.prose li>ol{margin:.25em 0 0}
.prose li.task{list-style:none;margin-left:-1.4em}
.prose li.task input{margin-right:.5em;accent-color:var(--accent)}
.prose blockquote{border-left:3px solid var(--accent);padding-left:1em;color:var(--ink-2)}
.prose code{font:.86em var(--mono);background:var(--panel);padding:.12em .35em;border-radius:4px}
.prose pre{background:var(--panel);padding:13px 15px;border-radius:9px;overflow:auto}
.prose pre code{background:none;padding:0;font-size:14px;line-height:1.55}
.prose hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.table-wrap{overflow-x:auto;margin:0 0 1em}
.prose table{border-collapse:collapse;margin:0;font-family:var(--sans);font-size:15px}
.prose th,.prose td{border:1px solid var(--line);padding:6px 11px;text-align:left}
.prose th{background:var(--panel);font-weight:600}
.prose .empty{color:var(--ink-3);font-style:italic}
.kb-link{padding:.05em .4em;border-radius:6px;background:var(--accent-soft);color:var(--accent);text-decoration:none;font:500 .9em var(--sans);white-space:nowrap}
.kb-link:hover{text-decoration:underline}
.kb-link .ic{width:.95em;height:.95em;vertical-align:-.12em;margin-right:.3em}
.kb-link.missing{background:none;color:var(--ink-3);border:1px dashed var(--ink-3);cursor:help}
.kb-link.missing:hover{text-decoration:none}

/* Folder page */
.folder{flex:1;overflow:auto;padding:28px 24px 60px;-webkit-overflow-scrolling:touch}
.folder-inner{max-width:760px;margin:0 auto}
.f-trail{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--ink-3);margin:0 0 6px}
.f-trail a{color:var(--ink-3);text-decoration:none}
.f-trail a:hover{color:var(--accent);text-decoration:underline}
.f-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.folder h2{font:600 30px/1.2 var(--serif);margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
.f-meta{color:var(--ink-3);margin:4px 0 0;font-size:14px}
.f-btns{display:flex;gap:8px}
.f-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.f-list li+li{border-top:1px solid var(--line)}
.f-row{display:flex;align-items:center;gap:11px;min-height:50px;padding:8px 15px;color:var(--ink);text-decoration:none}
.f-row:hover{background:var(--panel)}
.f-row .ic{color:var(--ink-3)}
.f-row .ic.f-dir{color:var(--accent)}
.f-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-row small{color:var(--ink-3);font-size:13px;flex:none}
.f-empty{color:var(--ink-3);padding:6px 0}

/* Link badge on mind map ideas and flowchart steps */
.node-link{position:relative;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin:-3px -5px -3px 7px;border-radius:50%;vertical-align:middle;color:var(--n);background:var(--bg);cursor:pointer;flex:none}
.node-link::after{content:"";position:absolute;inset:-8px}
.node-link .ic{width:14px;height:14px}
.node-link:hover{color:var(--accent)}
.mm.root .node-link{color:var(--accent);background:var(--accent-ink)}
.node-link.missing{opacity:.45}

/* Diagram stage */
.stage{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--bg)}
.viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:default;background-image:radial-gradient(var(--line) 1.1px,transparent 1.2px);background-size:24px 24px;-webkit-user-select:none;user-select:none}
.viewport:focus-visible{outline:none}
.world{position:absolute;left:0;top:0;transform-origin:0 0;width:0;height:0}
.edges{position:absolute;overflow:visible;pointer-events:none}
.edges .line{fill:none;stroke-width:2;stroke-linecap:round}
.edges .hit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
.edges .tip{stroke:none}
.edge-label{position:absolute;left:0;top:0;padding:1px 7px;border-radius:6px;background:var(--bg);color:var(--ink-2);font-size:13px;white-space:nowrap;cursor:pointer;border:1px solid var(--line)}
.edge-label.sel{border-color:var(--accent);color:var(--accent)}
.node{position:absolute;left:0;top:0;--n:var(--ink-3);cursor:grab;color:var(--ink);line-height:1.35;touch-action:none;overflow-wrap:anywhere;white-space:pre-wrap;will-change:transform}
.node.c0{--n:var(--c0)}.node.c1{--n:var(--c1)}.node.c2{--n:var(--c2)}.node.c3{--n:var(--c3)}.node.c4{--n:var(--c4)}.node.c5{--n:var(--c5)}
.node.dragging{opacity:.8;z-index:5;cursor:grabbing}
.node .tx.blank{color:var(--ink-3)}
.mm{width:max-content;max-width:250px;padding:7px 13px;border-radius:10px;background:var(--card);border:1.5px solid var(--n);min-width:44px;min-height:34px}
.mm.l1{font-weight:500}
.mm.root,.mm.root.l1{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font:600 19px/1.3 var(--serif);padding:13px 22px;border-radius:14px;max-width:300px}
.mm.root .tx.blank{color:inherit;opacity:.75}
.mm.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.mm.drop{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c3)}
.fold{position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--bg);border:1.5px solid var(--n);color:var(--ink-2);font:600 11px/19px var(--sans);text-align:center;cursor:pointer;white-space:nowrap}
.fold::after{content:"";position:absolute;inset:-11px}
.fold.r{right:-12px}.fold.l{left:-12px}
.fl{width:172px;min-height:62px;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 14px;border:1.5px solid var(--n);border-radius:10px;background:var(--card)}
.fl.s-terminal{border-radius:999px;padding:11px 24px;min-height:52px}
.fl.s-note{border-style:dashed;background:var(--card);border-radius:4px;text-align:left;justify-content:flex-start}
.fl.s-decision{width:214px;min-height:124px;padding:30px 50px;border:0;background:none}
.fl.s-data{width:190px;padding:11px 30px;border:0;background:none}
.fl .shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.fl .shape polygon{fill:var(--card);stroke:var(--n);stroke-width:1.5;vector-effect:non-scaling-stroke}
.fl .tx{position:relative}
.fl.sel:not(.s-decision):not(.s-data){box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.fl.sel .shape polygon{stroke:var(--accent);stroke-width:3}
.fl.target{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c3)}
.fl.target .shape polygon{stroke:var(--c3);stroke-width:3}
.handle{position:absolute;width:15px;height:15px;margin:-7.5px;border-radius:50%;background:var(--accent);border:2.5px solid var(--bg);cursor:crosshair}
.handle::after{content:"";position:absolute;inset:-12px;border-radius:50%}
.tool-group{position:absolute;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;z-index:6;box-shadow:0 2px 8px rgba(60,50,30,.08)}
.tool-group.tl{left:12px;top:12px}
.tool-group.tr{right:12px;top:12px}
.zoom-val{min-width:46px;font-size:13px;color:var(--ink-2);text-align:center;border-radius:8px}
.zoom-val:hover{background:var(--panel-2)}
.actions{position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));max-width:calc(100% - 20px);display:flex;align-items:stretch;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow);z-index:6;overflow-x:auto;scrollbar-width:none}
.actions::-webkit-scrollbar{display:none}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:58px;min-height:48px;padding:3px 7px;border-radius:10px;font-size:12px;color:var(--ink-2);flex:none;white-space:nowrap}
.act:hover:not(:disabled){background:var(--panel-2);color:var(--ink)}
.act.on{background:var(--accent-soft);color:var(--accent)}
.act.del{color:var(--danger)}
.hint{display:flex;align-items:center;gap:10px;padding:8px 13px;color:var(--ink-2);font-size:14px;white-space:nowrap}
.node-edit{position:absolute;z-index:8;resize:none;border:2px solid var(--accent);border-radius:9px;background:var(--card);padding:6px 10px;line-height:1.35;box-shadow:var(--shadow);overflow:hidden;font-size:16px}
.node-edit:focus{outline:none}

@supports (color:color-mix(in srgb,red,blue)){
  .mm.l1{background:color-mix(in srgb,var(--n) 13%,var(--card))}
  .fl{background:color-mix(in srgb,var(--n) 10%,var(--card))}
  .fl.s-note,.fl.s-decision,.fl.s-data{background:none}
  .fl.s-note{background:var(--card)}
  .fl .shape polygon{fill:color-mix(in srgb,var(--n) 10%,var(--card))}
}

/* Menus, dialogs, toasts */
.menu{position:fixed;z-index:50;min-width:204px;max-width:calc(100vw - 20px);max-height:calc(100dvh - 20px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:5px;box-shadow:var(--shadow)}
.menu button,.menu a{display:flex;align-items:center;gap:10px;width:100%;min-height:var(--tap);padding:5px 10px;border-radius:7px;text-align:left;color:var(--ink);text-decoration:none}
.menu button:hover,.menu a:hover,.menu button:focus-visible{background:var(--panel-2)}
.menu .ic{color:var(--ink-3)}
.menu .del,.menu .del .ic{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.swatches{display:flex;gap:6px;padding:7px}
.menu .swatches button{width:34px;height:34px;min-height:0;padding:0;border-radius:50%;background:var(--s);display:block}
.menu .swatches button.none{background:none;border:1.5px dashed var(--ink-3)}
.menu .swatches button:hover{outline:2px solid var(--ink-3);outline-offset:1px;background:var(--s)}
.menu .swatches button.none:hover{background:none}
dialog.dlg{border:1px solid var(--line);border-radius:15px;background:var(--bg);color:var(--ink);padding:0;width:calc(100vw - 32px);max-width:440px;box-shadow:var(--shadow)}
dialog.dlg::backdrop{background:rgba(30,25,15,.42)}
.dlg form{padding:20px}
.dlg h2{font:600 21px/1.3 var(--serif);margin:0 0 10px}
.dlg p{margin:0 0 14px;color:var(--ink-2);overflow-wrap:anywhere}
.dlg-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:6px}
.toasts{position:fixed;z-index:60;left:50%;transform:translateX(-50%);top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:calc(100% - 28px)}
.toast{background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:10px;box-shadow:var(--shadow);max-width:520px;font-size:14.5px;animation:toast .16s ease-out}
.toast.bad{background:var(--danger);color:var(--accent-ink)}
@keyframes toast{from{opacity:0;transform:translateY(-6px)}}
.other{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:var(--ink-2)}

/* Narrow screens: the side panel becomes a drawer */
@media (max-width:860px){
  :root{--side:min(86vw,330px)}
  .shell,.shell.side-off{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:var(--side);z-index:30;transform:translateX(-102%);transition:transform .18s ease-out;box-shadow:var(--shadow);visibility:hidden;transition:transform .18s ease-out,visibility 0s .18s}
  .shell.side-on .side{transform:none;visibility:visible;transition:transform .18s ease-out}
  .shell.side-on .scrim{display:block;position:fixed;inset:0;z-index:25;background:rgba(30,25,15,.38)}
  .top{padding-left:8px}
  .starts{grid-template-columns:minmax(0,1fr)}
  .start{min-height:0;display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:0;align-items:center}
  .start .ic{grid-row:span 2}
  .home h2{font-size:27px}
  .home{align-items:flex-start}
  .note textarea,.prose{padding:20px 18px 80px}
  .folder{padding:20px 16px 60px}
  .folder h2{font-size:26px}
  .crumb-path{display:none}
  .state{font-size:12.5px}
}
@media (max-width:480px){
  .btn-save{padding:0 11px}
  .actions{left:8px;right:8px;max-width:none;transform:none;justify-content:space-between}
  .act{flex:1 1 0;min-width:0;padding:3px 1px;font-size:11.5px}
  .hint{flex:1;white-space:normal;justify-content:center;text-align:center;font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
'use strict';
/* ------------------------------------------------------------------
   Change these two lines if you like.
   SITE_NAME  is the title shown in the side panel.
   NOTES_REPO is the repository suggested on the connect screen.

   Never paste your access token into this file. This file is public.
   ------------------------------------------------------------------ */
const SITE_NAME = 'Knowledge Base';
const NOTES_REPO = 'knowledge-notes';

/* ---------- Small helpers ---------- */
const API = 'https://api.github.com';
const SVG_NS = 'http://www.w3.org/2000/svg';
const $ = (s, el = document) => el.querySelector(s);

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k in el && !k.startsWith('aria') && !k.startsWith('data')) el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  el.append(...kids.flat().filter(k => k != null && k !== false));
  return el;
}
function s(tag, attrs, ...kids) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  el.append(...kids);
  return el;
}
function icon(name, cls) {
  const u = s('use', { href: '#i-' + name });
  return s('svg', { class: 'ic' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true' }, u);
}
const uid = () => Math.random().toString(36).slice(2, 9);
const debounce = (fn, ms) => { let t; const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; d.flush = (...a) => { clearTimeout(t); fn(...a); }; return d; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const store = {
  get(k, area = localStorage) { try { return area.getItem(k); } catch { return null; } },
  set(k, v, area = localStorage) { try { area.setItem(k, v); return true; } catch { return false; } },
  del(k, area = localStorage) { try { area.removeItem(k); } catch { /* storage blocked */ } },
  keys() { try { return Object.keys(localStorage); } catch { return []; } }
};
function session() { try { return sessionStorage; } catch { return null; } }

function toast(msg, bad) {
  const t = h('div', { class: 'toast' + (bad ? ' bad' : '') }, msg);
  $('.toasts').append(t);
  setTimeout(() => t.remove(), bad ? 6500 : 3200);
}

/* ---------- Paths and file kinds ---------- */
const SUFFIX = { note: '.md', mindmap: '.mindmap.json', flow: '.flow.json' };
const KIND_LABEL = { note: 'note', mindmap: 'mind map', flow: 'flowchart' };
const KIND_ICON = { note: 'note', text: 'note', mindmap: 'mindmap', flow: 'flow', other: 'external' };
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
const dirname = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
const basename = p => p.slice(p.lastIndexOf('/') + 1);
const join = (a, b) => a ? a + '/' + b : b;
function kindOf(path) {
  const n = path.toLowerCase();
  if (n.endsWith('.mindmap.json')) return 'mindmap';
  if (n.endsWith('.flow.json')) return 'flow';
  if (n.endsWith('.md') || n.endsWith('.markdown')) return 'note';
  if (n.endsWith('.txt')) return 'text';
  return 'other';
}
function suffixOf(path) {
  const b = basename(path), low = b.toLowerCase();
  for (const x of ['.mindmap.json', '.flow.json', '.markdown', '.md', '.txt']) if (low.endsWith(x)) return b.slice(b.length - x.length);
  return '';
}
function displayName(path) {
  const b = basename(path), x = suffixOf(path);
  return x ? b.slice(0, b.length - x.length) : b;
}
function checkName(raw) {
  const n = String(raw || '').normalize('NFC').trim().replace(/\s+/g, ' ');
  if (!n) return { error: 'Enter a name.' };
  if (/[/\\:*?"<>|\u0000-\u001f]/.test(n)) return { error: 'Names can\'t contain / \\ : * ? " < > |' };
  if (n.startsWith('.')) return { error: 'Names can\'t start with a dot.' };
  if (n.endsWith('.')) return { error: 'Names can\'t end with a dot.' };
  if (n.length > 120) return { error: 'Use a name of 120 characters or fewer.' };
  return { name: n };
}

/* ---------- Text encoding (keeps Thai and other languages intact) ---------- */
function toBase64(text) {
  const bytes = new TextEncoder().encode(text);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function fromBase64(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ---------- GitHub ---------- */
class GitHubError extends Error {
  constructor(status, message) { super(message); this.status = status; }
}
const gh = {
  conn: null,
  get base() { return '/repos/' + encodeURIComponent(this.conn.owner) + '/' + encodeURIComponent(this.conn.repo); },
  async call(path, opts = {}) {
    const headers = { Accept: 'application/vnd.github+json' };
    if (this.conn.token) headers.Authorization = 'Bearer ' + this.conn.token;
    if (opts.body) headers['Content-Type'] = 'application/json';
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 30000);
    let res;
    try {
      res = await fetch(API + path, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: 'no-store', signal: ctl.signal });
    } catch {
      throw new GitHubError(0, 'Can\'t reach GitHub. Check your connection and try again.');
    } finally { clearTimeout(timer); }
    if (res.ok) return res.status === 204 ? null : res.json();
    let msg = '';
    try { msg = (await res.json()).message || ''; } catch { /* no JSON body */ }
    throw new GitHubError(res.status, this.explain(res, msg));
  },
  explain(res, msg) {
    const remaining = res.headers.get('x-ratelimit-remaining');
    if (res.status === 401) return 'GitHub rejected the access token. It may have expired or been deleted.';
    if ((res.status === 403 || res.status === 429) && (remaining === '0' || /rate limit/i.test(msg))) {
      const at = Number(res.headers.get('x-ratelimit-reset')) * 1000;
      return 'GitHub\'s request limit was reached.' + (at ? ' Try again after ' + new Date(at).toLocaleTimeString() + '.' : ' Try again later.');
    }
    if (res.status === 403) return 'This token can\'t make that change. Give it Contents: Read and write access to this repository.';
    return msg || 'GitHub returned an error (' + res.status + ').';
  },
  repo() { return this.call(this.base); },
  async tree(ref) {
    try {
      const t = await this.call(this.base + '/git/trees/' + encodeURIComponent(ref) + '?recursive=1');
      return { entries: t.tree, truncated: t.truncated };
    } catch (e) {
      if (e.status === 404 || e.status === 409) return { entries: [], truncated: false }; // Empty repository
      throw e;
    }
  },
  async blob(sha) {
    const b = await this.call(this.base + '/git/blobs/' + sha);
    return fromBase64(b.content || '');
  },
  put(path, text, sha, message) {
    const body = { message, content: toBase64(text), branch: this.conn.branch };
    if (sha) body.sha = sha;
    return this.call(this.base + '/contents/' + encPath(path), { method: 'PUT', body });
  },
  /* Changes several files in one commit: used for moves, renames and deletes. */
  async commit(changes, message) {
    const branch = encPath(this.conn.branch);
    const ref = await this.call(this.base + '/git/ref/heads/' + branch);
    const parent = await this.call(this.base + '/git/commits/' + ref.object.sha);
    const tree = await this.call(this.base + '/git/trees', { method: 'POST', body: { base_tree: parent.tree.sha, tree: changes } });
    const commit = await this.call(this.base + '/git/commits', { method: 'POST', body: { message, tree: tree.sha, parents: [ref.object.sha] } });
    await this.call(this.base + '/git/refs/heads/' + branch, { method: 'PATCH', body: { sha: commit.sha } });
    return tree.sha;
  }
};

/* ---------- Unsaved drafts stay on this device until they reach GitHub ---------- */
const drafts = {
  key(path) { return 'kb.draft.' + gh.conn.owner + '/' + gh.conn.repo + ':' + path; },
  get(path) { try { return JSON.parse(store.get(this.key(path))); } catch { return null; } },
  set(path, text, baseSha) { return store.set(this.key(path), JSON.stringify({ text, baseSha, at: Date.now() })); },
  del(path) { store.del(this.key(path)); },
  paths() {
    const p = 'kb.draft.' + gh.conn.owner + '/' + gh.conn.repo + ':';
    return store.keys().filter(k => k.startsWith(p)).map(k => k.slice(p.length));
  },
  move(from, to) {
    for (const p of this.paths()) {
      if (p === from || p.startsWith(from + '/')) {
        const d = this.get(p);
        this.del(p);
        if (d) this.set(to + p.slice(from.length), d.text, d.baseSha);
      }
    }
  }
};

/* ---------- Markdown: builds page elements directly, so note text can never run as code ---------- */
function safeUrl(u) { return /^(https?:|mailto:)/i.test(u) ? u : null; }
const INLINE = /(`+)([\s\S]+?)\1|\*\*([\s\S]+?)\*\*|\*(?=\S)([\s\S]+?)\*|~~([\s\S]+?)~~|!?\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)|(https?:\/\/[^\s<>)\]]+)|\[\[([^\]|\n]+?)(?:\|([^\]\n]+?))?\]\]/;
function inline(text, out) {
  while (text) {
    const m = INLINE.exec(text);
    if (!m) { addLines(text, out); return; }
    if (m.index) addLines(text.slice(0, m.index), out);
    if (m[1]) out.append(h('code', null, m[2]));
    else if (m[3] != null) inline(m[3], out.appendChild(h('strong')));
    else if (m[4] != null) inline(m[4], out.appendChild(h('em')));
    else if (m[5] != null) inline(m[5], out.appendChild(h('del')));
    else if (m[7] != null) {
      const url = safeUrl(m[7]);
      if (url) inline(m[6] || url, out.appendChild(h('a', { href: url, target: '_blank', rel: 'noopener noreferrer' })));
      else out.append(m[0]);
    } else if (m[8] != null) out.append(h('a', { href: m[8], target: '_blank', rel: 'noopener noreferrer' }, m[8]));
    else out.append(kbLink(m[9], m[10]));
    text = text.slice(m.index + m[0].length);
  }
}

/* ---------- Keyword links: [[Folder/Sub folder|keyword]] opens a folder or file in this repository ---------- */
const LINK_SUFFIXES = ['.md', '.markdown', '.mindmap.json', '.flow.json', '.txt'];

    inner.append(h('p', null, empty ? 'This repository is empty.' : 'Choose a file in the side panel to read it.'));
  } else {
    inner.append(h('p', null, empty ? 'Create your first file, or begin with three folders.' : 'Choose a file in the side panel, or create something new.'));
    const folder = folderExists(app.folder) ? app.folder : '';
    inner.append(h('div', { class: 'starts' },
      startCard('note', 'Note', 'Summaries and conclusions', () => newFile('note', folder)),
      startCard('mindmap', 'Mind map', 'Connect ideas around a topic', () => newFile('mindmap', folder)),
      startCard('flow', 'Flowchart', 'Map a process or decision', () => newFile('flow', folder))));
    if (!folderList().length) inner.append(h('button', { class: 'btn', type: 'button', onClick: starterFolders }, icon('folder'), 'Add Projects, Research and Knowledge folders'));
  }
  ui.body.replaceChildren(h('div', { class: 'home' }, inner));
  renderCrumbs();
}
function startCard(ic, title, sub, run) {
  return h('button', { class: 'start', type: 'button', onClick: run }, icon(ic), h('b', null, title), h('small', null, sub));
}
async function openPath(path) {
  const seq = ++app.openSeq;
  if (app.open && app.open.editor) { flushDraft(); app.open.editor.destroy(); }
  app.open = null;
  app.viewFolder = null;
  ui.banner.hidden = true;
  const entry = entryAt(path);
  let dir = dirname(path);
  while (dir) { app.expanded.add(dir); dir = dirname(dir); }
  app.folder = dirname(path);
  if (!entry) {
    ui.body.replaceChildren(h('div', { class: 'other' }, h('p', null, 'This file isn\'t in the repository. It may have been moved or deleted.')));
    renderCrumbs(); renderTree();
    return;
  }
  const kind = kindOf(path);
  app.open = { path, kind, sha: entry.sha, clean: '', editor: null };
  renderCrumbs(); renderState(); renderTree();
  if (kind === 'other') {
    ui.body.replaceChildren(h('div', { class: 'other' }, h('p', null, 'This site can\'t open this type of file.'), h('a', { class: 'btn', href: fileUrl(path), target: '_blank', rel: 'noopener noreferrer' }, icon('external'), 'Open on GitHub')));
    return;
  }
  ui.body.replaceChildren(h('div', { class: 'load' }, 'Loading…'));
  let text;
  try { text = await readBlob(entry.sha); }
  catch (e) {
    if (seq !== app.openSeq) return;
    ui.body.replaceChildren(h('div', { class: 'other' }, h('p', null, e.message), h('button', { class: 'btn', type: 'button', onClick: () => openPath(path) }, 'Try again')));
    if (e.status === 401) reconnectNotice();
    return;
  }
  if (seq !== app.openSeq) return;
  mountEditor(path, kind, entry.sha, text);
}
function normalise(kind, text) {
  if (kind === 'mindmap') return JSON.stringify(parseMindMap(text), null, 2) + '\n';
  if (kind === 'flow') return JSON.stringify(parseFlow(text), null, 2) + '\n';
  return text;
}
function mountEditor(path, kind, sha, text) {
  const opened = app.open;
  opened.sha = sha;
  let clean;
  try { clean = normalise(kind, text); }
  catch {
    ui.body.replaceChildren(h('div', { class: 'other' }, h('p', null, 'This file couldn\'t be read as a ' + KIND_LABEL[kind] + '. Nothing was changed.'), h('a', { class: 'btn', href: fileUrl(path), target: '_blank', rel: 'noopener noreferrer' }, icon('external'), 'Open on GitHub')));
    return;
  }
  opened.clean = clean;
  let start = clean, restored = null;
  const draft = readOnly() ? null : drafts.get(path);
  if (draft && draft.text !== clean) {
    try {
      normalise(kind, draft.text);
      start = draft.text;
      if (draft.baseSha === sha) restored = 'same';
      else { restored = 'older'; opened.sha = draft.baseSha; }
    } catch { drafts.del(path); }
  } else if (draft) drafts.del(path);
  const opts = { readOnly: readOnly(), onChange, label: displayName(path), markdown: kind === 'note', restored: !!restored || app.freshNote === path };
  app.freshNote = null;
  const ed = kind === 'mindmap' ? new MindMap(parseMindMap(start), opts) : kind === 'flow' ? new Flow(parseFlow(start), opts) : new NoteEditor(start, opts);
  opened.editor = ed;
  ui.body.replaceChildren(ed.el);
  ed.mounted();
  renderCrumbs(); renderState();
  if (restored === 'same') setBanner('Your unsaved changes from this device were restored.', 'Discard them', discardDraft);
  if (restored === 'older') setBanner('This file changed on another device after your unsaved edits. Saving will let you choose which version to keep.');
}
async function discardDraft() {
  if (!app.open) return;
  drafts.del(app.open.path);
  const { path } = app.open;
  app.open = null;
  await openPath(path);
}

/* ---------- Drafts and saving ---------- */
const saveDraft = debounce(flushDraft, 400);
function flushDraft() {
  if (!app.open || !app.open.editor || readOnly()) return;
  if (isDirty()) app.draftFailed = !drafts.set(app.open.path, app.open.editor.text(), app.open.sha);
  else drafts.del(app.open.path);
}
function onChange() {
  renderState();
  saveDraft();
  clearTimeout(onChange.t);
  onChange.t = setTimeout(renderTree, 500);
}
async function save() {
  const o = app.open;
  if (!o || !o.editor || app.saving || readOnly() || !isDirty()) return;
  const text = o.editor.text();
  app.saving = true; renderState();
  try {
    const res = await gh.put(o.path, text, o.sha, (o.sha ? 'Update ' : 'Add ') + o.path);
    afterSave(o, text, res.content.sha);
  } catch (e) {
    app.saving = false; renderState();
    flushDraft();
    if (e.status === 409 || (e.status === 422 && /sha/i.test(e.message))) await resolveConflict(o, text);
    else fail(e);
    return;
  }
  app.saving = false; renderState();
}
function afterSave(o, text, sha) {
  o.sha = sha; o.clean = text;
  addEntry(o.path, sha, text);
  if (app.open === o && o.editor.text() === text) drafts.del(o.path);
  ui.banner.hidden = true;
  renderTree();
}
async function resolveConflict(o, text) {
  const r = await dialog({
    title: 'This file changed on another device',
    body: 'Someone saved a newer version after you opened this file. Choose what to do with your version.',
    actions: [
      { label: 'Cancel' },
      { label: 'Use the newer version', value: 'theirs' },
      { label: 'Replace it with mine', value: 'mine', danger: true },
      { label: 'Keep both', value: 'both', primary: true }
    ]
  });
  if (!r || app.open !== o) return;
  app.saving = true; renderState();
  try {
    await refresh(true, true);
    const latest = entryAt(o.path);
    if (r.action === 'mine') {
      const res = await gh.put(o.path, text, latest ? latest.sha : null, 'Update ' + o.path);
      afterSave(o, text, res.content.sha);
    } else if (r.action === 'theirs') {
      drafts.del(o.path);
      app.saving = false;
      app.open = null;
      await openPath(o.path);
    } else {
      const stamp = new Date().toISOString().slice(0, 16).replace('T', ' ').replace(':', '');
      let copy = join(dirname(o.path), `${displayName(o.path)} (copy ${stamp})${suffixOf(o.path)}`);
      for (let n = 2; entryAt(copy); n++) copy = join(dirname(o.path), `${displayName(o.path)} (copy ${stamp} ${n})${suffixOf(o.path)}`);
      const res = await gh.put(copy, text, null, 'Add ' + copy);
      addEntry(copy, res.content.sha, text);
      drafts.del(o.path);
      app.saving = false;
      app.open = null;
      renderTree();
      go(copy);
      toast('Saved your version as a copy.');
    }
  } catch (e) { fail(e); }
  app.saving = false;
  renderState();
}

/* ---------- Picking up changes from other devices ---------- */
async function refresh(quiet, noReopen) {
  if (!app.connected) return;
  try {
    setEntries(await gh.tree(gh.conn.branch));
    renderTree();
    refreshFolderView();
    if (!quiet) toast('Up to date with GitHub.');
    const o = app.open;
    if (!o || !o.editor || noReopen || Date.now() - app.lastWrite < 15000) return;
    const cur = entryAt(o.path);
    if (!cur) {
      o.sha = null;
      setBanner('This file was moved or deleted on another device. Saving will create it again here.');
    } else if (cur.sha !== o.sha) {
      if (isDirty()) setBanner('A newer version was saved on another device. Saving will let you choose which version to keep.');
      else { app.open = null; o.editor.destroy(); await openPath(o.path); toast('Updated from another device.'); }
    }
  } catch (e) {
    if (!quiet) fail(e);
  }
}

/* ---------- Page events ---------- */
addEventListener('hashchange', route);
addEventListener('keydown', e => {
  /* Diagram shortcuts keep working after a toolbar button removes itself and focus falls back to the page. */
  const ed = app.open && app.open.editor;
  if (ed && ed.key && !openMenuEl && !$('dialog[open]') && (e.target === document.body || (e.target.closest('.stage') && e.target.tagName !== 'TEXTAREA'))) ed.key(e);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (app.connected) { if (app.open && app.open.editor && app.open.editor.stopEdit) app.open.editor.stopEdit(true); save(); } }
  if (e.key === 'Escape' && app.connected && narrow() && ui.shell.classList.contains('side-on')) toggleSide(false);
});
addEventListener('beforeunload', e => {
  if (!app.connected) return;
  flushDraft();
  if (isDirty() && app.draftFailed) { e.preventDefault(); e.returnValue = ''; }
});
addEventListener('pagehide', () => { if (app.connected) flushDraft(); });
document.addEventListener('visibilitychange', () => {
  if (!app.connected) return;
  if (document.visibilityState === 'hidden') flushDraft();
  else if (Date.now() - app.lastSync > 30000) refresh(true);
});
addEventListener('resize', () => { if (app.connected) ui.menuBtn.hidden = ui.shell.classList.contains('side-on') && !narrow(); });

/* ---------- Start ---------- */
(async function start() {
  applyTheme();
  document.title = SITE_NAME;
  const saved = loadConn();
  if (!saved) { showGate(); return; }
  $('#app').replaceChildren(h('div', { class: 'load', style: 'height:100%' }, 'Connecting to GitHub…'));
  try {
    await connect(saved);
    startShell();
  } catch (e) {
    showGate(e.status === 401 ? 'Your access token no longer works. Enter a new one to continue.' : e.status === 404 ? 'Repository not found. Check the name, and check that the token can access it.' : e.message, saved);
  }
})();
</script>
